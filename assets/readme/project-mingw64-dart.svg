<svg viewBox="0 0 580 160" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <style>.mono { font-family: 'Fira Code','Consolas',monospace; }</style>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="g">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="580" height="160" rx="12" fill="url(#cardBg)"/>
  <rect width="578" height="158" x="1" y="1" rx="11"
        fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
  <!-- Top accent line -->
  <rect x="0" y="0" width="580" height="3" rx="2" fill="#38bdf8" opacity="0.7"/>

  <!-- Repo icon -->
  <text x="22" y="40" font-size="18">📦</text>

  <!-- Repo name -->
  <text x="48" y="40" class="mono" font-size="17" font-weight="600" fill="#38bdf8"
        filter="url(#g)">mingw64_dart</text>

  <!-- Star + fork -->
  <text x="490" y="40" class="mono" font-size="12" fill="#8b949e">⭐ 3</text>
  <text x="535" y="40" class="mono" font-size="12" fill="#8b949e">🍴 0</text>

  <!-- Description -->
  <text x="22" y="66" class="mono" font-size="12" fill="#c9d1d9">
    Dart SDK packaged for MSYS2 MinGW64 — native launcher,
  </text>
  <text x="22" y="84" class="mono" font-size="12" fill="#c9d1d9">
    SHA256-verified, auto-updated daily via GitHub Actions.
  </text>

  <!-- Divider -->
  <line x1="22" y1="100" x2="558" y2="100" stroke="#21262d" stroke-width="1"/>

  <!-- Language pills -->
  <!-- Shell -->
  <circle cx="34" cy="122" r="6" fill="#89e051"/>
  <text x="45" y="126" class="mono" font-size="11" fill="#8b949e">Shell</text>

  <!-- C -->
  <circle cx="104" cy="122" r="6" fill="#555555"/>
  <text x="115" y="126" class="mono" font-size="11" fill="#8b949e">C</text>

  <!-- PKGBUILD -->
  <rect x="148" y="114" width="90" height="18" rx="4" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="193" y="126" class="mono" font-size="10" fill="#4ade80" text-anchor="middle">PKGBUILD</text>

  <!-- Build badge area -->
  <rect x="380" y="112" width="80" height="20" rx="4" fill="#1f2d1f" stroke="#166534" stroke-width="1"/>
  <text x="420" y="125" class="mono" font-size="10" fill="#4ade80" text-anchor="middle">build ✓</text>

  <!-- MIT badge -->
  <rect x="468" y="112" width="90" height="20" rx="4" fill="#1f1f10" stroke="#854d0e" stroke-width="1"/>
  <text x="513" y="125" class="mono" font-size="10" fill="#f59e0b" text-anchor="middle">MIT license</text>

  <!-- Link hint -->
  <text x="22" y="148" class="mono" font-size="10" fill="#30363d">
    github.com/Bloby22/mingw64_dart
  </text>

<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
