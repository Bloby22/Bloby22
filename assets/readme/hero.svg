<svg viewBox="0 0 1200 320" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <style>
      .mono { font-family: 'Fira Code','Cascadia Code','Consolas',monospace; }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#060d18"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8b949e"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#ffffff" opacity="0.045"/>
    </pattern>

    <clipPath id="main"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>

  <!-- BG -->
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)" clip-path="url(#main)"/>

  <!-- Left accent stripe -->
  <rect x="0" y="0" width="3" height="320" rx="2" fill="#00ff41"/>

  <!-- Top-right decorative grid lines -->
  <line x1="900" y1="0"   x2="1200" y2="300" stroke="#00ff41" stroke-width="0.4" opacity="0.06"/>
  <line x1="950" y1="0"   x2="1200" y2="250" stroke="#00ff41" stroke-width="0.4" opacity="0.06"/>
  <line x1="1000" y1="0"  x2="1200" y2="200" stroke="#00ff41" stroke-width="0.4" opacity="0.06"/>
  <line x1="1050" y1="0"  x2="1200" y2="150" stroke="#00ff41" stroke-width="0.4" opacity="0.06"/>
  <line x1="1100" y1="0"  x2="1200" y2="100" stroke="#00ff41" stroke-width="0.4" opacity="0.06"/>

  <!-- Border -->
  <rect width="1198" height="318" x="1" y="1" rx="15"
        fill="none" stroke="#00ff41" stroke-width="1" opacity="0.15"/>

  <!-- Corner marks -->
  <path d="M1 24 L1 1 L24 1"   fill="none" stroke="#00ff41" stroke-width="2" opacity="0.6"/>
  <path d="M1176 1 L1199 1 L1199 24" fill="none" stroke="#00ff41" stroke-width="2" opacity="0.6"/>
  <path d="M1 296 L1 319 L24 319"  fill="none" stroke="#00ff41" stroke-width="2" opacity="0.6"/>
  <path d="M1176 319 L1199 319 L1199 296" fill="none" stroke="#00ff41" stroke-width="2" opacity="0.6"/>

  <!-- === LEFT — text === -->

  <!-- Eyebrow -->
  <text x="42" y="62" class="mono"
        font-size="11" fill="#00ff41" letter-spacing="4" opacity="0.8">// DEVELOPER PROFILE</text>

  <!-- Name -->
  <text x="40" y="128" class="mono"
        font-size="62" font-weight="700" fill="url(#nameGrad)"
        filter="url(#glow2)">Michal</text>

  <!-- Green underscore blink simulation — static -->
  <rect x="40" y="136" width="220" height="3" rx="1" fill="#00ff41" opacity="0.5"/>

  <!-- Role line -->
  <text x="42" y="172" class="mono"
        font-size="15" fill="#8b949e">Full-Stack &amp; Systems Developer</text>

  <!-- Tags row -->
  <!-- TS -->
  <rect x="42"  y="188" width="104" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="94"  y="203" class="mono" font-size="10" fill="#3b82f6" text-anchor="middle">TypeScript</text>
  <!-- Rust -->
  <rect x="152" y="188" width="60"  height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="182" y="203" class="mono" font-size="10" fill="#f97316" text-anchor="middle">Rust</text>
  <!-- C++ -->
  <rect x="218" y="188" width="52"  height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="244" y="203" class="mono" font-size="10" fill="#60a5fa" text-anchor="middle">C++</text>
  <!-- Kotlin -->
  <rect x="276" y="188" width="62"  height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="307" y="203" class="mono" font-size="10" fill="#a855f7" text-anchor="middle">Kotlin</text>
  <!-- Dart -->
  <rect x="344" y="188" width="50"  height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="369" y="203" class="mono" font-size="10" fill="#38bdf8" text-anchor="middle">Dart</text>
  <!-- Java -->
  <rect x="400" y="188" width="50"  height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="425" y="203" class="mono" font-size="10" fill="#f59e0b" text-anchor="middle">Java</text>

  <!-- Divider -->
  <line x1="42" y1="224" x2="700" y2="224" stroke="#21262d" stroke-width="1"/>

  <!-- Bio block as code comment -->
  <text x="42" y="248" class="mono" font-size="13" fill="#8b949e">/*</text>
  <text x="42" y="266" class="mono" font-size="13" fill="#8b949e">  Building tools for MSYS2, mobile, and the web.</text>
  <text x="42" y="284" class="mono" font-size="13" fill="#8b949e">  Czech Republic 🇨🇿  ·  bloby.fun  ·  michal@bloby.fun</text>
  <text x="42" y="302" class="mono" font-size="13" fill="#8b949e">*/</text>

  <!-- === RIGHT — terminal card === -->

  <!-- Card shadow -->
  <rect x="762" y="42" width="410" height="250" rx="12" fill="#000" opacity="0.35"/>

  <!-- Card bg -->
  <rect x="760" y="40" width="410" height="250" rx="12"
        fill="#161b22" stroke="#21262d" stroke-width="1"/>

  <!-- Titlebar -->
  <rect x="760" y="40" width="410" height="38" rx="12" fill="#21262d"/>
  <rect x="760" y="62"  width="410" height="16" fill="#21262d"/>

  <!-- Traffic lights -->
  <circle cx="785" cy="59" r="6" fill="#ff5f57"/>
  <circle cx="806" cy="59" r="6" fill="#ffbd2e"/>
  <circle cx="827" cy="59" r="6" fill="#28c840"/>
  <text x="965" y="64" class="mono" font-size="11" fill="#8b949e" text-anchor="middle">~ bash — Bloby22</text>

  <!-- Terminal lines -->
  <text x="782" y="102" class="mono" font-size="12" fill="#00ff41">❯</text>
  <text x="800" y="102" class="mono" font-size="12" fill="#c9d1d9"> cat developer.ts</text>

  <text x="782" y="122" class="mono" font-size="11" fill="#8b949e">const dev = {</text>
  <text x="782" y="140" class="mono" font-size="11">
    <tspan fill="#58a6ff">  name</tspan><tspan fill="#8b949e">:    </tspan><tspan fill="#a5d6ff">"Michal"</tspan><tspan fill="#8b949e">,</tspan>
  </text>
  <text x="782" y="158" class="mono" font-size="11">
    <tspan fill="#58a6ff">  from</tspan><tspan fill="#8b949e">:    </tspan><tspan fill="#a5d6ff">"Czech Republic 🇨🇿"</tspan><tspan fill="#8b949e">,</tspan>
  </text>
  <text x="782" y="176" class="mono" font-size="11">
    <tspan fill="#58a6ff">  focus</tspan><tspan fill="#8b949e">:   </tspan><tspan fill="#a5d6ff">"Systems + FullStack"</tspan><tspan fill="#8b949e">,</tspan>
  </text>
  <text x="782" y="194" class="mono" font-size="11">
    <tspan fill="#58a6ff">  learning</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#a5d6ff">"Rust + WASM"</tspan><tspan fill="#8b949e">,</tspan>
  </text>
  <text x="782" y="212" class="mono" font-size="11" fill="#8b949e">};</text>

  <text x="782" y="234" class="mono" font-size="12" fill="#00ff41">❯</text>
  <rect x="800" y="221" width="8" height="16" rx="1" fill="#00ff41" opacity="0.8"/>

  <!-- Status dot -->
  <circle cx="1148" cy="59" r="5" fill="#00ff41" opacity="0.9"/>
  <text x="1140" y="64" class="mono" font-size="10" fill="#00ff41" text-anchor="end">ONLINE</text>

<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
